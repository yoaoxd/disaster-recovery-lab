[metadata]
name = disaster-recovery-lab
version = 0.1.0
description = Disposable PostgreSQL recovery drills with verified restores and JSON evidence
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/yoaoxd/disaster-recovery-lab
project_urls =
    Issues = https://github.com/yoaoxd/disaster-recovery-lab/issues

[options]
py_modules = disaster_recovery_lab
python_requires = >=3.10

[options.entry_points]
console_scripts =
    dr-lab = disaster_recovery_lab:main
